name: moca3d
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - matplotlib==3.10.7
      - numpy==1.26.4
      - omegaconf==2.3.0
      - opencv-python==4.11.0.86
      - pillow==11.3.0
      - safetensors==0.7.0
      - scipy==1.16.3
      - timm==1.0.24
      - tqdm==4.67.1
      - webdataset==1.0.2

# Install pytorch3d separately after creating this environment.
# Use a build compatible with your torch/torchvision/CUDA versions.
